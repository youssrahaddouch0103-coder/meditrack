# Spring Boot Configuration - Cabinet Dentaire
spring.application.name=backend
server.port=8080

# Servlet Multipart Upload & Tomcat Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=20MB

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cabinet_dentaire_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Spring Mail / Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:contact@meditrack.local}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.test-connection=false

app.mail.from=${MAIL_FROM:${spring.mail.username:contact@meditrack.local}}
app.mail.cabinet-name=${CABINET_NAME:YT Smile Center}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
